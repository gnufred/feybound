{{ $url := .Get "url" }}
{{ $cleanedURL := replace $url (printf "/%s/" .Site.Language.Lang) "" }}
{{ $picPage := site.GetPage $cleanedURL }}
<div class="media picture" id="{{ .Get "id" }}">
	<i class="fa-regular fa-image"></i>
    <a href="{{ $url }}">{{ .Get "title" }}</a>
	<i class="fa-regular fa-image"></i>
	<link rel="prefetch" href="{{ $url }}/">
	{{ if $picPage }}
		{{ $picImage := $picPage.Params.image }}
		<link rel="prefetch" href="{{ $picImage }}">
	{{ end }}
</div>
