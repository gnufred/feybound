<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Non Trouvée</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        :root {
            --background-color: #fff;
            --text-color: #000;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #1a1a1a;
                --text-color: #f1f1f1;
            }
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
        }
        p {
            font-size: 1.5rem;
        }
        a {
            text-decoration: none;
            color: var(--link-color);
            border-bottom: 1px solid var(--link-color);
        }
        a:hover {
            color: var(--link-hover-color);
            border-bottom: 1px solid var(--link-hover-color);
        }
        img {
            width: 200px;
            margin: 20px 0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --link-color: #1e90ff;
                --link-hover-color: #ff6347;
            }
            .logo-light {
                display: none;
            }
            .logo-dark {
                display: inline;
            }
        }
        @media (prefers-color-scheme: light) {
            :root {
                --link-color: #007acc;
                --link-hover-color: #005f99;
            }
            .logo-dark {
                display: none;
            }
            .logo-light {
                display: inline;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page Non Trouvée</h1>
        <img src="/logo-light.svg" alt="Logo" class="logo-light">
        <img src="/logo-dark.svg" alt="Logo" class="logo-dark">
        <p>Désolé, mais la page que vous cherchez n'a pas pu être trouvée.</p>
        <p><a href="/fr/">Retourner à la page d'accueil</a></p>
    </div>
</body>
</html>
